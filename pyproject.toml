[project]
name = "gwb_templates"
version = "0.1.0"
description = "A package with GWB templates."
authors = [{ name = "Mauro Pieroni", email = "mauro.pieroni@csic.es" }]
license = { text = "GPL-3.0" }
dependencies = ["jax>=0.5.0", "numpy>=1.21", "scipy>=1.7", "interpax>=0.1.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project.optional-dependencies]
dev = ["flake8-black>=0.3.6", "pytest"]
# SIGWAY-backed scalar-induced GW templates. Needs a JAX new enough for
# jax.scipy.special.sici (used by SIGWAY's EMD kernel).
sigway = ["sigway", "jax>=0.8.0", "diffrax", "interpax"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gwb_templates = [
    "generic_templates/**/*",
    "inflation_templates/**/*",
    "FOPT_templates/**/*",
    "cosmic_string_templates/**/*",
    "astrophysical_templates/**/*",
    "scalar_induced_templates/**/*",
]


[tool.black]
line-length = 88
